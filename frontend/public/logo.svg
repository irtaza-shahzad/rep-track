<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(100, 50%, 24%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(118, 29%, 61%);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left weight plates (outer) -->
  <rect x="100" y="300" width="60" height="200" rx="30" fill="url(#sageGradient)"/>
  
  <!-- Left weight plates (inner) -->
  <rect x="170" y="320" width="50" height="160" rx="25" fill="url(#sageGradient)"/>
  
  <!-- Right weight plates (outer) -->
  <rect x="640" y="300" width="60" height="200" rx="30" fill="url(#sageGradient)"/>
  
  <!-- Right weight plates (inner) -->
  <rect x="580" y="320" width="50" height="160" rx="25" fill="url(#sageGradient)"/>
  
  <!-- Center bar -->
  <rect x="220" y="380" width="360" height="40" rx="20" fill="url(#sageGradient)"/>
  
  <!-- Upward trending arrow integrated into the bar -->
  <path d="M 300 420 L 400 320 L 500 420" 
        stroke="hsl(118, 29%, 61%)" 
        stroke-width="35" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Arrow head pointing up -->
  <path d="M 400 320 L 370 350 M 400 320 L 430 350" 
        stroke="hsl(118, 29%, 61%)" 
        stroke-width="35" 
        stroke-linecap="round" 
        fill="none"/>
</svg>
